<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXPERIMENT-04 · SEARCH PATTERN MAP</title>
<style>
:root{
  --bg:#0A0A0A;--g1:#246C3C;--g2:#3C9C6C;--g3:#52F29A;
  --orange:#F26400;--red:#E2280F;--amber:#F49F09;--yellow:#D8C22A;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --cond:"Arial Narrow","Avenir Next Condensed","Helvetica Neue",Arial,sans-serif;
  --jp:"Hiragino Mincho ProN","Yu Mincho",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);overflow:hidden;font-family:var(--mono);text-transform:uppercase}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
svg{position:absolute;inset:0;width:100%;height:100%}

.callout{
  position:absolute;border:2px solid var(--red);color:var(--red);background:rgba(10,10,10,.85);
  font-size:12px;line-height:1.35;letter-spacing:.06em;padding:4px 9px;z-index:5;
  text-shadow:0 0 4px rgba(226,40,15,.6);white-space:nowrap;
}
.callout b{font-weight:400;color:var(--amber)}

/* title plate — boxed kanji grid + EN caption */
.plate{position:absolute;right:22px;bottom:22px;z-index:6;text-align:center;color:var(--paper)}
.plate .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.plate .grid span{
  border:2px solid #EDF8D6;color:#EDF8D6;font-family:var(--jp);font-weight:800;
  font-size:30px;line-height:1;padding:6px 10px;text-transform:none;background:rgba(10,10,10,.7);
}
.plate .en{margin-top:5px;font-family:var(--cond);font-weight:700;font-size:12px;
  letter-spacing:.26em;color:#EDF8D6}

.hud{position:absolute;left:22px;top:20px;z-index:6;color:var(--amber);font-size:12px;line-height:1.3}
.hud b{color:var(--orange);font-weight:400}
.stamp{display:inline-block;border:1px solid var(--red);color:var(--red);padding:2px 8px;
  border-radius:2px;font-weight:700;animation:blink 1s steps(1) infinite;margin-top:6px}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
</style>
</head>
<body>

<svg id="map" aria-label="Tactical map"></svg>

<div class="hud">
  GRID:<b>MERIDIAN-7</b><br>
  SWEEP:<b id="sweep">000</b> &nbsp; CONTACTS:<b>3</b><br>
  <span class="stamp">追跡中 · TRACKING</span>
</div>

<div class="callout" id="co-0"></div>
<div class="callout" id="co-1"></div>
<div class="callout" id="co-2"></div>

<div class="plate">
  <div class="grid"><span>索</span><span>敵</span><span>行</span><span>動</span></div>
  <div class="en">Search Pattern</div>
</div>

<script>
"use strict";
/* if loaded in a hidden/zero-size viewport, re-init once it has real size */
if(innerWidth<2||innerHeight<2){
  const _p=setInterval(()=>{if(innerWidth>1&&innerHeight>1){clearInterval(_p);location.reload();}},250);
}
/* Procedural city grid: rounded-diamond blocks in 3-level dim green,
   contour scribbles, orange crosshair, red callouts with leader lines. */

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const W = innerWidth, H = innerHeight;
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

const el = (n,attrs,parent=svg)=>{
  const e = document.createElementNS(NS,n);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  parent.appendChild(e);return e;
};

/* --- world group (pans slowly) --- */
const world = el("g",{});

/* street grid — city blocks with 45°-cut corners (the rounded-diamond motif) */
const CELL = 86;
for(let x=-CELL;x<W+CELL*2;x+=CELL){
  for(let y=-CELL;y<H+CELL*2;y+=CELL){
    const r = Math.random();
    const inset = 9, c = 16;   /* chamfer */
    const x0=x+inset, y0=y+inset, x1=x+CELL-inset, y1=y+CELL-inset;
    const pts = `${x0+c},${y0} ${x1-c},${y0} ${x1},${y0+c} ${x1},${y1-c} ${x1-c},${y1} ${x0+c},${y1} ${x0},${y1-c} ${x0},${y0+c}`;
    el("polygon",{points:pts,fill:"none",
      stroke: r<.12 ? "#3C9C6C" : "#246C3C","stroke-width":r<.12?1.6:1},world);
    if(r<.3){ /* inner diamond — block detail */
      const cx=x+CELL/2, cy=y+CELL/2, d=CELL/4.4;
      el("polygon",{points:`${cx},${cy-d} ${cx+d},${cy} ${cx},${cy+d} ${cx-d},${cy}`,
        fill:"none",stroke:"#246C3C","stroke-width":1},world);
    }
    if(r>.94){ /* bright feature block */
      el("rect",{x:x+CELL*.3,y:y+CELL*.34,width:CELL*.4,height:CELL*.3,
        fill:"none",stroke:"#52F29A","stroke-width":1.4},world);
    }
  }
}
/* contour lines — wandering polylines */
for(let i=0;i<14;i++){
  let px = Math.random()*W, py = Math.random()*H, d = "M"+px+" "+py;
  let ang = Math.random()*Math.PI*2;
  for(let s=0;s<26;s++){
    ang += (Math.random()-.5)*1.1;
    px += Math.cos(ang)*36; py += Math.sin(ang)*36;
    d += " L"+px.toFixed(1)+" "+py.toFixed(1);
  }
  el("path",{d,fill:"none",stroke:"#246C3C","stroke-width":1,opacity:.6},world);
}
/* × registration marks */
for(let i=0;i<26;i++){
  const x = Math.random()*W, y = Math.random()*H, s = 5;
  el("path",{d:`M${x-s} ${y-s} L${x+s} ${y+s} M${x+s} ${y-s} L${x-s} ${y+s}`,
    stroke:"#3C9C6C","stroke-width":1.2,opacity:.8},world);
}

/* --- route line (single yellow rule) --- */
el("line",{x1:W*.55,y1:-20,x2:W*.5,y2:H+20,stroke:"#D8C22A","stroke-width":2,opacity:.85});

/* --- contacts (solid orange silhouettes) + leader lines --- */
const contacts = [
  {id:"co-0", x:W*.28,y:H*.34, vx:.22,vy:.10, lines:["CRV·081 <b>PELICAN</b>","SALVAGE TUG"]},
  {id:"co-1", x:W*.62,y:H*.62, vx:-.14,vy:.16, lines:["UN·FFG·402 <b>TERCEL</b>","PICKET FRIGATE"]},
  {id:"co-2", x:W*.76,y:H*.22, vx:-.20,vy:.06, lines:["UNK·CONTACT <b>SIERRA·9</b>","CLASSIFY PENDING"]},
];
for(const c of contacts){
  c.g = el("g",{});
  /* top-down hull silhouette */
  el("polygon",{points:"0,-26 7,-12 6,18 3,26 -3,26 -6,18 -7,-12",
    fill:"#F26400",opacity:.95,stroke:"#F26400"},c.g);
  el("rect",{x:-3,y:-6,width:6,height:10,fill:"#0A0A0A"},c.g);
  c.leader = el("line",{stroke:"#E2280F","stroke-width":1});
  const box = document.getElementById(c.id);
  box.innerHTML = c.lines.join("<br>");
  c.box = box;
}

/* --- crosshair target --- */
const cross = el("g",{stroke:"#F26400","stroke-width":4,fill:"none"});
el("line",{x1:-60,y1:0,x2:-14,y2:0},cross);
el("line",{x1:14,y1:0,x2:60,y2:0},cross);
el("line",{x1:0,y1:-60,x2:0,y2:-14},cross);
el("line",{x1:0,y1:14,x2:0,y2:60},cross);
el("rect",{x:-5,y:-5,width:10,height:10,"stroke-width":2},cross);
let tx = W*.45, ty = H*.5;

/* --- animation: stepped ticks, no easing --- */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let wx = 0, wy = 0, sweep = 0, crossOn = true;

setInterval(()=>{                            /* world pan + contact drift, 8Hz steps */
  wx -= 1.5; wy -= .5;
  world.setAttribute("transform",`translate(${wx%CELL},${wy%CELL})`);
  for(const c of contacts){
    c.x += c.vx*8; c.y += c.vy*8;
    if(c.x<40||c.x>W-40) c.vx*=-1;
    if(c.y<40||c.y>H-60) c.vy*=-1;
    const rot = Math.atan2(c.vy,c.vx)*180/Math.PI + 90;
    c.g.setAttribute("transform",`translate(${c.x},${c.y}) rotate(${rot})`);
    /* callout offset above-right, leader anchors to hull */
    const bx = Math.min(W-230, c.x+46), by = Math.max(16, c.y-64);
    c.box.style.left = bx+"px"; c.box.style.top = by+"px";
    c.leader.setAttribute("x1",c.x); c.leader.setAttribute("y1",c.y);
    c.leader.setAttribute("x2",bx);  c.leader.setAttribute("y2",by+20);
  }
},125);

setInterval(()=>{                            /* crosshair wanders + blinks */
  tx += (Math.random()-.5)*30; ty += (Math.random()-.5)*30;
  tx = Math.max(80,Math.min(W-80,tx)); ty = Math.max(80,Math.min(H-80,ty));
  crossOn = REDUCED ? true : !crossOn;
  cross.setAttribute("opacity",crossOn?1:.15);
  cross.setAttribute("transform",`translate(${tx},${ty})`);
},500);

setInterval(()=>{                            /* sweep counter */
  sweep = (sweep+1)%1000;
  document.getElementById("sweep").textContent = String(sweep).padStart(3,"0");
},1000);
</script>
</body>
</html>
