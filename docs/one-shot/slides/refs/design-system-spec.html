<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DESIGN-SYSTEM.md</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.6;
      color: #d1d5da;
      background-color: #0d1117;
      margin: 0;
      padding: 45px;
      max-width: 850px;
      margin: 0 auto;
    }
    h1, h2, h3 {
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.25;
      border-bottom: 1px solid #30363d;
      padding-bottom: 0.3em;
      color: #f0f6fc;
    }
    h1 { font-size: 2em; }
    h2 { font-size: 1.5em; }
    h3 { font-size: 1.25em; border-bottom: none; }
    p, ul, ol { margin-bottom: 16px; }
    li { margin-bottom: 4px; }
    code {
      padding: 0.2em 0.4em;
      margin: 0;
      font-size: 85%;
      background-color: rgba(110,118,129,0.4);
      border-radius: 3px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      color: #ff7b72;
    }
    pre {
      padding: 16px;
      overflow: auto;
      font-size: 85%;
      line-height: 1.45;
      background-color: #161b22;
      border-radius: 6px;
      margin-bottom: 16px;
      border: 1px solid #30363d;
    }
    pre code {
      background: none;
      padding: 0;
      font-size: 100%;
      color: #d1d5da;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 16px;
    }
    table th, table td {
      padding: 6px 13px;
      border: 1px solid #30363d;
    }
    table th {
      background-color: #161b22;
      color: #f0f6fc;
    }
    table tr:nth-child(2n) {
      background-color: #161b22;
    }
    blockquote {
      padding: 0 1em;
      color: #8b949e;
      border-left: 0.25em solid #30363d;
      margin: 0 0 16px 0;
    }
    hr {
      height: 0.25em;
      padding: 0;
      margin: 24px 0;
      background-color: #30363d;
      border: 0;
    }
    #content {
      opacity: 0;
      transition: opacity 0.2s ease-in;
    }
    #content.loaded {
      opacity: 1;
    }
    a {
      color: #58a6ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="content">Loading documentation...</div>

  <script>
    async function loadMarkdown() {
      const contentDiv = document.getElementById('content');
      try {
        // Path relative to the file in public/refs/ — must match the file's
        // exact case (GitHub Pages is case-sensitive).
        const response = await fetch('DESIGN-SYSTEM.md');
        if (!response.ok) throw new Error(`Failed to fetch MD: ${response.statusText}`);
        const markdown = await response.text();
        contentDiv.innerHTML = marked.parse(markdown);
        contentDiv.classList.add('loaded');
      } catch (err) {
        contentDiv.innerHTML = `<p style="color: #ff7b72;">Error loading DESIGN-SYSTEM.md: ${err.message}</p>`;
        // Surface the error instead of leaving the div invisible at opacity:0.
        contentDiv.classList.add('loaded');
      }
    }
    loadMarkdown();
  </script>
</body>
</html>
