name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # node-pty prebuilds cover win32 + darwin only; linux has none and
        # compiles from source via node-gyp (its install script falls back).
        # Both paths work here. macos would too — prebuild availability is
        # not what's keeping it off this list.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # pnpm test invokes node with a glob quoted POSIX-style; bash keeps
        # that consistent across OSes (Windows cmd handles quoting differently).
        shell: bash

    steps:
      # v5+ runs the action itself on node24; v4 is force-shimmed and warns.
      - uses: actions/checkout@v5

      # v6 is the first major supporting pnpm 11 (see packageManager pin).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # pnpm v9 supports --audit-level; fails the step only on moderate+.
      # Advisory for low/info — keeps supply-chain signal without breaking
      # the build on noise.
      - run: pnpm audit --audit-level=moderate
        continue-on-error: true