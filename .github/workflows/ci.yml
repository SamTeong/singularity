name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Changed-file test selection (scripts/test-changed.mjs). A PR runs only the
  # suites and mock specs its diff can affect; a push to main runs everything.
  plan:
    name: Select tests
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.select.outputs.unit }}
      mock: ${{ steps.select.outputs.mock }}
      mock_specs: ${{ steps.select.outputs.mock_specs }}
      shards: ${{ steps.select.outputs.shards }}
      shard_total: ${{ steps.select.outputs.shard_total }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: select
        run: node scripts/test-changed.mjs --plan ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '--all' }}

  test:
    name: Test (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # node-pty prebuilds cover win32 + darwin only; linux has none and
        # compiles from source via node-gyp (its install script falls back).
        # Both paths work here. macos would too — prebuild availability is
        # not what's keeping it off this list.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # pnpm test invokes node with a glob quoted POSIX-style; bash keeps
        # that consistent across OSes (Windows cmd handles quoting differently).
        shell: bash

    steps:
      # v5+ runs the action itself on node24; v4 is force-shimmed and warns.
      - uses: actions/checkout@v5

      # v6 is the first major supporting pnpm 11 (see packageManager pin).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Gate the step, not the job: main's required checks are these two matrix
      # names, and a job-level skip would leave them pending.
      - if: needs.plan.outputs.unit == 'true'
        run: pnpm test

      # pnpm v9 supports --audit-level; fails the step only on moderate+.
      # Advisory for low/info — keeps supply-chain signal without breaking
      # the build on noise.
      - run: pnpm audit --audit-level=moderate
        continue-on-error: true

  e2e-mock:
    name: E2E mock (${{ matrix.shard }}/${{ needs.plan.outputs.shard_total }})
    needs: plan
    if: needs.plan.outputs.mock != 'none'
    runs-on: ubuntu-latest
    # Browsers + OS deps preinstalled; `playwright install --with-deps` hit a
    # 22 min apt stall. Keep the tag equal to the @playwright/test pin.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mock
      # mock_specs is empty when every spec is selected. A shard can get no tests.
      - run: pnpm exec playwright test --config playwright.mock.config.mjs --shard ${{ matrix.shard }}/${{ needs.plan.outputs.shard_total }} --pass-with-no-tests ${{ needs.plan.outputs.mock_specs }}
      - name: Upload mock E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mock-e2e-failure-${{ matrix.shard }}
          path: test-results/mock/
          retention-days: 7
          if-no-files-found: warn
